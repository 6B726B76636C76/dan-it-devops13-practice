global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: 
        chat_id: 
        parse_mode: "HTML"
        message: |
          {{ range .Alerts }}
          <b>{{ .Labels.severity | toUpper }}</b>: {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
