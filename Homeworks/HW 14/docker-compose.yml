services:
  app-nginx:
    image: nginx:alpine
    container_name: app-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started

  app:
    build: "../HW 13"
    container_name: app-api
    networks:
      app-network:
        ipv4_address: 172.20.0.10
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
