version: '3.9'
services:

  api:
    build: .
    container_name: myapi
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/api/logs
      - ./students.csv:/api/students.csv:ro
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD:     ${REDIS_PASSWORD}
      REDIS_USER:         ${REDIS_USER}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        {
          echo "bind 0.0.0.0"
          echo "requirepass $${REDIS_PASSWORD}"
          echo "appendonly yes"
          echo "appendfsync everysec"
        } > /usr/local/etc/redis/redis.conf &&
        {
          echo "user default on nopass ~* +@all"
          echo "user $${REDIS_USER} on >$${REDIS_USER_PASSWORD} ~* +@all"
        } > /usr/local/etc/redis/users.acl &&
        exec redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 8s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  redis-data: